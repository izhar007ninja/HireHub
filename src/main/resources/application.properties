spring.application.name=hirehub-api
server.port= 8080

spring.datasource.url=jdbc:mysql://localhost:3306/hirehub_db
spring.datasource.username=root
spring.datasource.password=X
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

hirehub.jwt.secret=X
hirehub.jwt.expiration=X


springdoc.api-docs.path = /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter = method
springdoc.swagger-ui.tags-sorter = alpha
springdoc.swagger-ui.doc-expansion=none


spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache prefix and null value storage
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=hirehub:
spring.cache.redis.cache-null-values=false