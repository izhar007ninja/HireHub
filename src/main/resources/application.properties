spring.application.name=hirehub-api


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hirehub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=hirehub:
spring.cache.redis.cache-null-values=false


hirehub.jwt.secret=${HIREHUB_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
hirehub.jwt.expiration-ms=${HIREHUB_JWT_EXPIRATION_MS:86400000}


hirehub.storage.upload-dir=${HIREHUB_STORAGE_UPLOAD_DIR:uploads/resumes}
hirehub.storage.base-url=${HIREHUB_STORAGE_BASE_URL:http://localhost:8080/api/resumes}


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=INFO
logging.level.com.hirehub=INFO