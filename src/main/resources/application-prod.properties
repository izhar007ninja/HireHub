
spring.application.name=hirehub-api

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis
spring.data.redis.url=${SPRING_DATA_REDIS_URL}
spring.cache.type=redis
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=hirehub:
spring.cache.redis.cache-null-values=false

# JWT
hirehub.jwt.secret=${HIREHUB_JWT_SECRET}
hirehub.jwt.expiration-ms=${HIREHUB_JWT_EXPIRATION_MS:86400000}

# Resume Storage
hirehub.storage.upload-dir=${HIREHUB_STORAGE_UPLOAD_DIR:/tmp/hirehub/resumes}
hirehub.storage.base-url=${HIREHUB_STORAGE_BASE_URL:https://hirehub-api.onrender.com/api/resumes}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Render Server Port
server.port=${PORT:8080}

# Actuator Health Check
management.endpoints.web.exposure.include=health

# Logging
logging.level.root=INFO
logging.level.com.hirehub=INFO
