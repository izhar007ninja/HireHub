
spring.application.name=hirehub-api-test

# ======================================
# MYSQL TEST DATABASE
# ======================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/test_database?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ======================================
# JPA / HIBERNATE
# ======================================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ======================================
# REDIS
# ======================================

spring.data.redis.url=redis://localhost:6379
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ======================================
# JWT
# ======================================

hirehub.jwt.secret=${HIREHUB_JWT_SECRET}
hirehub.jwt.expiration=3600000
