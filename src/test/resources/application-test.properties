
spring.application.name=hirehub-api-test

# MYSQL - TEST DATABASE ONLY
spring.datasource.url=${TEST_DATABASE_URL}
spring.datasource.username=${TEST_DATABASE_USERNAME}
spring.datasource.password=${TEST_DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIBERNATE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# REDIS
spring.data.redis.host=${TEST_REDIS_HOST:localhost}
spring.data.redis.port=${TEST_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.cache-null-values=false

# JWT
hirehub.jwt.secret=${TEST_JWT_SECRET}
hirehub.jwt.expiration-ms=3600000
