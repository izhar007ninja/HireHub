
name: HireHub CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest

    services:

      # MYSQL TEST DATABASE
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: hirehub_test_db
          MYSQL_USER: hirehub_test
          MYSQL_PASSWORD: ci_test_password

        ports:
          - "3307:3306"

        options: >-
          --health-cmd="MYSQL_PWD=ci_test_password mysql -h 127.0.0.1 -u hirehub_test hirehub_test_db -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

      # REDIS
      redis:
        image: redis:7-alpine

        ports:
          - "6379:6379"

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # CHECKOUT
      - name: Checkout Code
        uses: actions/checkout@v4

      # JAVA
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # RUN TESTS
      - name: Run Tests with Maven
        env:
          SPRING_PROFILES_ACTIVE: test

          # MySQL
          TEST_DATABASE_URL: "jdbc:mysql://localhost:3307/hirehub_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          TEST_DATABASE_USERNAME: hirehub_test
          TEST_DATABASE_PASSWORD: ci_test_password

          # Redis
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: "6379"

          # JWT
          TEST_JWT_SECRET: ${{ secrets.HIREHUB_TEST_JWT_SECRET }}

        run: mvn clean verify --batch-mode

      # UPLOAD TEST REPORTS
      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
